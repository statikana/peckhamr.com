name = "peckhamr"

"$schema" = "./node_modules/wrangler/config-schema.json"

compatibility_date = "2026-10-17"
compatibility_flags = [
    "nodejs_als",
    "nodejs_compat"
]

workers_dev = true
preview_urls = true

routes = [
    { pattern = "peckhamr.com", custom_domain = true },
    { pattern = "magic.peckhamr.com", custom_domain = true },
    { pattern = "cosmo.peckhamr.com", custom_domain = true },
    { pattern = "notes.peckhamr.com", custom_domain = true },
    { pattern = "media.peckhamr.com", custom_domain = true },
    { pattern = "convert.peckhamr.com", custom_domain = true },
    { pattern = "terminal.peckhamr.com", custom_domain = true }
]

main = ".svelte-kit/cloudflare/_worker.js"

[assets]
binding = "ASSETS"  # name used to refer to the assets
directory = ".svelte-kit/cloudflare"  # build assets to be served

# D1 Database: SQLite
# Stores user and password information
[[d1_databases]]
binding = "cosmo_users"  # referred to by worker
database_name = "cosmo_users"  # referred to by JS
database_id = "ca0da580-dd9a-4885-86f6-8c20bc14db1f"

[vars]
MAGIC_MODE = "cloudflare"
# MAGIC_BACKEND_URL = "https://magic-backend.peckhamr.com"
# Set MAGIC_PROXY_SECRET via `wrangler secret put MAGIC_PROXY_SECRET` (never in git)
